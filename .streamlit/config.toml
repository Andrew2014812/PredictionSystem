[theme]
base = "dark"
primaryColor = "#1f7660"
backgroundColor = "#131618"
secondaryBackgroundColor = "#1b1f22"
textColor = "#e6e9ea"
borderColor = "#353c40"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "sans-serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
