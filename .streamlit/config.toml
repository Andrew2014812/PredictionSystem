[theme]
base = "dark"
primaryColor = "#269d7d"
backgroundColor = "#101820"
secondaryBackgroundColor = "#1b292d"
textColor = "#e1e7e5"
borderColor = "#2b3c40"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "sans-serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
