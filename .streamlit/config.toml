[theme]
base = "dark"
primaryColor = "#22c55e"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#131c2e"
textColor = "#e2e8f0"
borderColor = "#1f2a40"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "sans-serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
