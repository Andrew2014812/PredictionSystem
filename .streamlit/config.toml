[theme]
base = "dark"
primaryColor = "#127a63"
backgroundColor = "#0d1722"
secondaryBackgroundColor = "#14212f"
textColor = "#e4ebf2"
borderColor = "#2b3d50"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "sans-serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
