# Data update: results, fixtures, real odds and predictions.
#
# Every day at about 03:17 Kyiv time (automatic) and on demand: GitHub → Actions →
# "Update data and predictions" → "Run workflow".
#
#   results  — new results and fixtures, refreshed predictions. Free: no odds quota.
#   odds     — real bookmaker odds for matches in the next days: OddsPapi first (one billable
#              request for all fixtures; prices from the free historical endpoint, ~5 s per match),
#              The Odds API is off unless the ODDS_API_FALLBACK repository variable says
#              missing | always, or ODDS_API_LEAGUES names leagues OddsPapi lacks (e.g. "T1"); its
#              stored prices are always used; refreshed predictions.
#   full     — both (the daily run).
#   history  — manual only: OddsPapi price archive of played matches (free endpoint, ~600 matches an
#              hour, resumable; default the current season from 1 August), then the missing prices of
#              recorded predictions are filled from it (marked as archived) and the season backtest is
#              regenerated with the archived prices. Recorded picks are never changed otherwise.
#
# Optional (manual runs): limit the odds update to one league (E0, SP1 …), one match day
# (YYYY-MM-DD) or one match id, and "force" to re-price inside the refresh window.
#
# The schedule is written in Kyiv time (IANA time zone, supported by GitHub since March 2026), so
# summer and winter time need no second schedule. On the spring switch day 03:17 does not exist and
# GitHub starts the run at the next valid time (about 04:00); on the autumn switch day 03:17 happens
# twice. The "once a day" step keeps one scheduled run per Kyiv date: it reads the date of the last
# successful daily run (local_data/daily_run.json, committed with the data) and skips a repeat. A run
# that GitHub starts late still runs, and a failed run does not block a manual rerun the same day.
# GitHub delays scheduled runs under load (November 2026: created 6-7 hours after 03:17). For the exact
# time an external scheduler can send a "daily-update" repository_dispatch at 03:17; the schedule stays
# as the fallback and whichever comes first runs.
# The run commits local_data/ to main; Streamlit Cloud redeploys automatically and a local
# checkout catches up with `git pull`. Quotas: `python scripts/odds_credits.py` (also printed
# in the run summary). If an API is down or a quota is exhausted, the run keeps the existing data.
name: Update data and predictions

on:
  schedule:
    - cron: "17 3 * * *"     # 03:17 in Kyiv all year; not on the hour, when GitHub drops runs
      timezone: "Europe/Kyiv"
  # The same daily run started from outside GitHub at the exact time (GitHub's own schedule has
  # started 6-7 hours late in November 2026). Optional: an external scheduler calls the
  # workflow_dispatch API with inputs {"mode": "full", "daily": true} (token: Actions read/write on this
  # repository only), or sends a "daily-update" repository_dispatch. See README, "Daily update time".
  # Every daily trigger shares the once-per-Kyiv-date guard.
  repository_dispatch:
    types: [daily-update]
  workflow_dispatch:
    inputs:
      mode:
        description: "What to update"
        type: choice
        options: [results, odds, full, history]
        default: results
      credit_budget:
        description: "Max The Odds API credits for this run (odds / full only)"
        type: number
        default: 30
      league:
        description: "Only this league code (optional, odds / full)"
        type: string
        default: ""
      day:
        description: "Only matches on this day, YYYY-MM-DD (optional)"
        type: string
        default: ""
      match_id:
        description: "Only this match id (optional)"
        type: string
        default: ""
      force:
        description: "Re-price even if asked recently"
        type: boolean
        default: false
      daily:
        description: "Count as the daily run (once per Kyiv date; for an external scheduler)"
        type: boolean
        default: false
      history_since:
        description: "history: first day, YYYY-MM-DD (empty = 1 August of the current season)"
        type: string
        default: ""
      history_max:
        description: "history: at most this many matches in this run (the rest next run)"
        type: number
        default: 1600

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'history' && 330 || 75 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Once a day
        id: time
        run: |
          daily="${{ inputs.daily }}"
          case "${{ github.event_name }}" in schedule|repository_dispatch) daily=true ;; esac
          if [ "$daily" != "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(TZ=Europe/Kyiv date +%F)
          last=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("kyiv_date",""))' \
                 local_data/daily_run.json 2>/dev/null || true)
          if [ "$last" = "$today" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "The daily update for $today (Kyiv) has already run, skipping this repeat." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "kyiv_date=$today" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.time.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.time.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Run pipeline
        if: steps.time.outputs.run == 'true' && inputs.mode != 'history'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDS_API_FALLBACK: ${{ vars.ODDS_API_FALLBACK || 'off' }}
          ODDS_API_LEAGUES: ${{ vars.ODDS_API_LEAGUES || '' }}
        run: |
          mode="${{ inputs.mode || 'full' }}"
          args=(--mode "$mode" --credit-budget "${{ inputs.credit_budget || 30 }}")
          [ -n "${{ inputs.league }}" ] && args+=(--odds-league "${{ inputs.league }}")
          [ -n "${{ inputs.day }}" ] && args+=(--odds-date "${{ inputs.day }}")
          [ -n "${{ inputs.match_id }}" ] && args+=(--odds-match "${{ inputs.match_id }}")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          python scripts/run_pipeline.py "${args[@]}" | tee pipeline.log
          echo "### Data sources" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; [print("- " + l) for l in json.load(open("local_data/api/diagnostics/last_run.json"))["lines"]]' \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo "### Pipeline ($mode)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -n 40 pipeline.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Download the price archive
        if: inputs.mode == 'history'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          args=(--go --max-matches "${{ inputs.history_max || 1600 }}")
          [ -n "${{ inputs.history_since }}" ] && args+=(--since "${{ inputs.history_since }}")
          # this script comes from the commit the run was started from (main may not have it yet)
          git fetch -q --depth 1 origin "${{ github.sha }}"
          git show "${{ github.sha }}:scripts/merge_history_archive.py" > "$RUNNER_TEMP/merge_history_archive.py"
          python scripts/oddspapi_history.py "${args[@]}" | tee history.log
          python "$RUNNER_TEMP/merge_history_archive.py" save "$RUNNER_TEMP/archive"
      - name: Keep the downloaded archive
        if: always() && inputs.mode == 'history'
        uses: actions/upload-artifact@v4
        with:
          name: oddspapi-archive
          path: ${{ runner.temp }}/archive
          retention-days: 14
          if-no-files-found: ignore
      - name: Fill recorded prices on the newest data and commit
        if: inputs.mode == 'history'
        run: |
          # The daily run may have committed while the download ran (hours): start from the newest
          # main, add only the downloaded archive, then fill prices and regenerate the backtest.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            python "$RUNNER_TEMP/merge_history_archive.py" merge "$RUNNER_TEMP/archive" | tee -a history.log
            python scripts/restore_recorded_odds.py --go | tee -a history.log
            python scripts/regenerate_predictions.py 2>&1 | sed '/ INFO /d' | tee -a history.log
            git add local_data
            git diff --cached --quiet && { echo "No data changes."; break; }
            git commit -q -m "Add the OddsPapi price archive and fill recorded prices"
            if git push origin HEAD:main; then break; fi
            echo "main moved during the update, attempt $attempt failed; starting again from the newest main"
          done
          echo "### Price archive" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -n 60 history.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Show API quotas
        if: steps.time.outputs.run == 'true'
        run: |
          python scripts/odds_credits.py | tee quotas.log
          echo "### Quotas" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat quotas.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit updated data
        if: steps.time.outputs.run == 'true' && inputs.mode != 'history'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "${{ steps.time.outputs.kyiv_date }}" ]; then             # a daily run (schedule or external)
            printf '{"kyiv_date": "%s", "finished_at_utc": "%s", "run_id": "%s"}\n' \
              "${{ steps.time.outputs.kyiv_date }}" "$(date -u +%FT%TZ)" "${{ github.run_id }}" > local_data/daily_run.json
          fi
          git add local_data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data and predictions (${{ inputs.mode || 'daily' }})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
