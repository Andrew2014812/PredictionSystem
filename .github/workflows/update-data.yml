# Single writer of local_data/: refreshes results, fixtures, real odds and
# predictions twice a day and commits them to main. Streamlit Community Cloud
# redeploys on every push to main, so the deployed app and a local checkout of
# main (after `git pull`) always run the same code on the same data.
name: Update data and predictions

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/run_pipeline.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local_data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data and predictions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
