# Manual data update. Open GitHub → Actions → "Update data and predictions" →
# "Run workflow", pick what to update, press the green button.
#
#   results  — new results and fixtures, refreshed predictions. Free: no API credits.
#   odds     — real bookmaker odds for matches in the next days: OddsPapi first (one
#              request for all fixtures; prices from the free historical endpoint),
#              The Odds API as fallback (at most "credit_budget" credits), refreshed predictions.
#   full     — both.
#
# Optional: limit the odds update to one league (E0, SP1 …), one match day
# (YYYY-MM-DD) or one match id, and "force" to re-price inside the refresh window.
#
# The run commits local_data/ to main; Streamlit Cloud redeploys automatically and
# a local checkout catches up with `git pull`. No schedule: credits are only spent
# when someone presses the button (to restore a schedule add e.g.
#   schedule: [{cron: "0 18 * * 1"}, {cron: "0 18 * * 4"}]   # Mon + Thu 18:00 UTC).
name: Update data and predictions

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to update"
        type: choice
        options: [results, odds, full]
        default: results
      credit_budget:
        description: "Max The Odds API credits for this run (odds / full only)"
        type: number
        default: 60
      league:
        description: "Only this league code (optional, odds / full)"
        type: string
        default: ""
      day:
        description: "Only matches on this day, YYYY-MM-DD (optional)"
        type: string
        default: ""
      match_id:
        description: "Only this match id (optional)"
        type: string
        default: ""
      force:
        description: "Re-price even if asked recently"
        type: boolean
        default: false

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: |
          args=(--mode "${{ inputs.mode }}" --credit-budget "${{ inputs.credit_budget }}")
          [ -n "${{ inputs.league }}" ] && args+=(--odds-league "${{ inputs.league }}")
          [ -n "${{ inputs.day }}" ] && args+=(--odds-date "${{ inputs.day }}")
          [ -n "${{ inputs.match_id }}" ] && args+=(--odds-match "${{ inputs.match_id }}")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          python scripts/run_pipeline.py "${args[@]}"
      - name: Show API quotas
        run: python scripts/odds_credits.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local_data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data and predictions (${{ inputs.mode }})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
